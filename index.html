<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0c0f1a;
  --surface:   #111627;
  --panel:     #181e30;
  --card:      #1d2438;
  --line:      #242d45;
  --line2:     #1a2035;
  --primary:   #6366f1;
  --pri-dim:   rgba(99,102,241,.12);
  --green:     #10b981;
  --green-dim: rgba(16,185,129,.12);
  --rose:      #f43f5e;
  --rose-dim:  rgba(244,63,94,.12);
  --amber:     #f59e0b;
  --amb-dim:   rgba(245,158,11,.12);
  --sky:       #38bdf8;
  --sky-dim:   rgba(56,189,248,.12);
  --txt:       #e2e8f0;
  --txt2:      #8896b3;
  --txt3:      #4a5578;
  --font: 'Inter', system-ui, -apple-system, sans-serif;
  --mono: 'SF Mono', 'Fira Code', 'Fira Mono', monospace;
}

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

html { font-size: 14px; }
body { background: var(--bg); color: var(--txt); font-family: var(--font); min-height: 100vh; }

/* ── Scrollbar ─────────────────────────────────────────────── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

/* ── Header ────────────────────────────────────────────────── */
.hdr {
  position: sticky; top: 0; z-index: 90;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  height: 52px;
  display: flex; align-items: center;
  padding: 0 20px; gap: 12px;
}
.hdr-logo {
  font-size: 13px; font-weight: 700; letter-spacing: -.3px;
  display: flex; align-items: center; gap: 8px;
}
.hdr-logo svg { flex-shrink: 0; }
.hdr-spacer { flex: 1; }
.hdr-sync {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--txt2);
}
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--txt3); flex-shrink: 0;
  transition: background .3s;
}
.dot.ok   { background: var(--green); }
.dot.busy { background: var(--amber); animation: blink 1s infinite; }
.dot.err  { background: var(--rose); }
@keyframes blink { 50% { opacity: .3; } }

.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 12px; border-radius: 7px;
  border: 1px solid var(--line); background: var(--card);
  color: var(--txt); font-size: 12px; font-family: var(--font);
  cursor: pointer; transition: border-color .15s, background .15s;
  white-space: nowrap;
}
.btn:hover { border-color: var(--primary); background: var(--panel); }
.btn-primary {
  background: var(--primary); border-color: var(--primary);
  color: #fff; font-weight: 600;
}
.btn-primary:hover { background: #5254d4; border-color: #5254d4; }
.btn-sm { padding: 4px 9px; font-size: 11px; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--txt2); }
.btn-ghost:hover { background: var(--card); border-color: var(--line); color: var(--txt); }

/* ── Main ──────────────────────────────────────────────────── */
.wrap { max-width: 1280px; margin: 0 auto; padding: 20px 20px 80px; }

/* ── Stat bar ───────────────────────────────────────────────── */
.stats {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 10px;
  margin-bottom: 16px;
}
.stat {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 14px 18px;
}
.stat-lbl { font-size: 11px; color: var(--txt2); font-weight: 500; margin-bottom: 5px; }
.stat-val { font-size: 22px; font-weight: 700; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.stat-val.out { color: var(--rose); }
.stat-val.in  { color: var(--green); }
.stat-val.net.pos { color: var(--green); }
.stat-val.net.neg { color: var(--rose); }
.stat-val.net.zero { color: var(--txt2); }
.stat-sub { font-size: 11px; color: var(--txt3); margin-top: 3px; }

/* ── Filters ─────────────────────────────────────────────────── */
.filters {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 14px;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  margin-bottom: 10px;
}
.fi {
  background: var(--card); border: 1px solid var(--line);
  color: var(--txt); border-radius: 7px;
  padding: 6px 10px; font-size: 12px; font-family: var(--font);
  outline: none; transition: border-color .15s;
}
.fi:focus { border-color: var(--primary); }
.fi-search { flex: 1; min-width: 140px; }
select.fi { cursor: pointer; min-width: 120px; }
.fi-reset {
  background: none; border: none; color: var(--txt3);
  font-size: 11px; cursor: pointer; padding: 4px 6px;
  border-radius: 5px; font-family: var(--font);
  transition: color .15s;
}
.fi-reset:hover { color: var(--txt); }

/* ── Result meta ─────────────────────────────────────────────── */
.meta {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 11px; color: var(--txt3); padding: 0 2px; margin-bottom: 8px;
}

/* ── Table container ─────────────────────────────────────────── */
.tbl-wrap {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden;
}
table { width: 100%; border-collapse: collapse; }

thead th {
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 9px 14px; text-align: left;
  font-size: 11px; font-weight: 600; color: var(--txt3);
  white-space: nowrap; cursor: pointer; user-select: none;
  transition: color .15s;
}
thead th:hover { color: var(--txt2); }
thead th.asc::after  { content: ' ↑'; color: var(--primary); }
thead th.desc::after { content: ' ↓'; color: var(--primary); }
thead th.active { color: var(--primary); }

tbody tr {
  border-bottom: 1px solid var(--line2);
  transition: background .1s;
}
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--card); }

td { padding: 10px 14px; vertical-align: middle; }

.td-date { font-size: 12px; color: var(--txt2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.td-desc { font-weight: 500; font-size: 13px; }
.td-amt  {
  text-align: right; white-space: nowrap;
  font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px;
  font-family: var(--mono);
}
.td-amt.out { color: var(--rose); }
.td-amt.in  { color: var(--green); }

/* Month separator row */
.tr-month td {
  background: var(--surface); padding: 5px 14px;
  font-size: 10px; font-weight: 600; color: var(--txt3);
  letter-spacing: .3px; border-bottom: 1px solid var(--line);
}

/* ── Pills ───────────────────────────────────────────────────── */
.pill {
  display: inline-flex; align-items: center;
  padding: 2px 7px; border-radius: 20px;
  font-size: 11px; font-weight: 500; white-space: nowrap;
}
.p-food         { background: rgba(251,191,36,.12); color: #fbbf24; }
.p-transport    { background: rgba(56,189,248,.12);  color: #38bdf8; }
.p-lifestyle    { background: rgba(167,139,250,.12); color: #a78bfa; }
.p-necessity    { background: rgba(16,185,129,.12);  color: #10b981; }
.p-subscription { background: rgba(244,63,94,.12);   color: #f87171; }
.p-travel       { background: rgba(45,212,191,.12);  color: #2dd4bf; }
.p-investments  { background: rgba(234,179,8,.12);   color: #eab308; }
.p-salary       { background: rgba(16,185,129,.15);  color: #34d399; }
.p-interest     { background: rgba(99,102,241,.12);  color: #818cf8; }
.p-default      { background: var(--card); color: var(--txt2); }

/* ── CC Status badge ─────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 7px; border-radius: 5px;
  font-size: 11px; font-weight: 500; white-space: nowrap;
  cursor: pointer; transition: opacity .15s;
}
.badge:hover { opacity: .75; }
.b-stmtd   { background: var(--green-dim); color: var(--green); }
.b-pending { background: var(--amb-dim);   color: var(--amber); }
.b-clear   { background: var(--sky-dim);   color: var(--sky); }

/* ── Card indicator ──────────────────────────────────────────── */
.card-tag {
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; color: var(--txt2); white-space: nowrap;
}
.card-pip { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }

/* ── Row actions ─────────────────────────────────────────────── */
.acts { display: flex; gap: 3px; opacity: 0; transition: opacity .15s; }
tr:hover .acts { opacity: 1; }
.act {
  background: none; border: none; color: var(--txt3);
  cursor: pointer; width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 5px; font-size: 13px; transition: all .15s;
}
.act:hover { background: var(--surface); color: var(--txt); }
.act.del:hover { color: var(--rose); }

/* ── Empty / Loading ─────────────────────────────────────────── */
.empty {
  text-align: center; padding: 60px 20px; color: var(--txt3);
}
.empty-ico { font-size: 32px; margin-bottom: 10px; }
.empty p { font-size: 13px; line-height: 1.6; }
.empty strong { color: var(--txt2); }

.loading {
  display: flex; flex-direction: column; align-items: center;
  padding: 60px; color: var(--txt3); gap: 12px;
}
.spin {
  width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid var(--line);
  border-top-color: var(--primary);
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── FAB ─────────────────────────────────────────────────────── */
.fab {
  position: fixed; bottom: 24px; right: 24px; z-index: 80;
  width: 50px; height: 50px; border-radius: 50%;
  background: var(--primary); border: none; color: #fff;
  font-size: 22px; cursor: pointer;
  box-shadow: 0 4px 24px rgba(99,102,241,.4);
  display: flex; align-items: center; justify-content: center;
  transition: transform .15s, box-shadow .15s;
}
.fab:hover { transform: scale(1.08); box-shadow: 0 6px 32px rgba(99,102,241,.5); }

/* ── Overlay & Modal ──────────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.65); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
}
.overlay.off { display: none; }

.modal {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; width: 460px;
  max-width: calc(100vw - 24px); max-height: calc(100dvh - 24px);
  overflow-y: auto; position: relative;
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 0;
}
.modal-title { font-size: 15px; font-weight: 600; }
.modal-close {
  background: none; border: none; color: var(--txt3);
  cursor: pointer; font-size: 18px; line-height: 1;
  width: 28px; height: 28px; display: flex;
  align-items: center; justify-content: center;
  border-radius: 6px; transition: all .15s;
}
.modal-close:hover { background: var(--card); color: var(--txt); }
.modal-body { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 13px; }

.fg { display: flex; flex-direction: column; gap: 5px; }
.fr { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
label { font-size: 11px; font-weight: 500; color: var(--txt2); }
input, select {
  background: var(--card); border: 1px solid var(--line);
  color: var(--txt); border-radius: 7px;
  padding: 8px 10px; font-size: 13px; font-family: var(--font);
  outline: none; width: 100%; transition: border-color .15s;
}
input:focus, select:focus { border-color: var(--primary); }
select { cursor: pointer; }

/* CC fields block */
.cc-block {
  background: var(--card); border: 1px solid var(--line);
  border-left: 2px solid var(--primary); border-radius: 8px;
  padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;
}
.cc-block-lbl { font-size: 10px; font-weight: 600; color: var(--primary); margin-bottom: 2px; }
.tog-row {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13px;
}
/* Toggle */
.tog { position: relative; width: 34px; height: 18px; flex-shrink: 0; }
.tog input { opacity: 0; width: 0; height: 0; position: absolute; }
.tog-sl {
  position: absolute; inset: 0; background: var(--line);
  border-radius: 18px; cursor: pointer; transition: background .2s;
}
.tog-sl::before {
  content: ''; position: absolute;
  width: 12px; height: 12px; background: #fff;
  border-radius: 50%; top: 3px; left: 3px;
  transition: transform .2s;
}
.tog input:checked ~ .tog-sl { background: var(--primary); }
.tog input:checked ~ .tog-sl::before { transform: translateX(16px); }

.form-acts { display: flex; justify-content: flex-end; gap: 8px; padding-top: 4px; }

/* Settings note */
.note {
  background: var(--amb-dim); border: 1px solid rgba(245,158,11,.2);
  border-radius: 7px; padding: 10px 12px;
  font-size: 12px; color: var(--amber); line-height: 1.55;
}

/* ── Toast ───────────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 86px; right: 24px; z-index: 300;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 9px; padding: 10px 14px; font-size: 12px;
  max-width: 280px; transform: translateY(8px); opacity: 0;
  transition: all .22s; pointer-events: none;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.ok  { border-color: rgba(16,185,129,.35); color: var(--green); }
.toast.bad { border-color: rgba(244,63,94,.35);  color: var(--rose); }

/* ── Mobile ──────────────────────────────────────────────────── */
@media (max-width: 680px) {
  .wrap { padding: 12px 12px 80px; }
  .stats { grid-template-columns: 1fr 1fr; }
  .stats .stat:last-child { grid-column: 1/-1; }
  .stat-val { font-size: 18px; }
  .col-card, .col-status { display: none; }
  .modal { border-radius: 14px 14px 0 0; align-self: flex-end; width: 100%; max-width: 100%; }
  .overlay { align-items: flex-end; }
  .fr { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ── Header ────────────────────────────────────────────────── -->
<header class="hdr">
  <div class="hdr-logo">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
      <rect width="22" height="22" rx="6" fill="#6366f1"/>
      <path d="M5 12h4l2-5 2 8 2-4h2" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Ledger
  </div>
  <div class="hdr-spacer"></div>
  <div class="hdr-sync">
    <div class="dot" id="dot"></div>
    <span id="syncLbl">—</span>
  </div>
  <button class="btn btn-sm" onclick="manualSync()">↻ Sync</button>
  <button class="btn btn-sm" onclick="openSettings()">⚙</button>
</header>

<!-- ── Main ──────────────────────────────────────────────────── -->
<div class="wrap">

  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      <div class="stat-lbl">Money Out</div>
      <div class="stat-val out" id="sOut">SGD —</div>
      <div class="stat-sub" id="sOutN"></div>
    </div>
    <div class="stat">
      <div class="stat-lbl">Money In</div>
      <div class="stat-val in" id="sIn">SGD —</div>
      <div class="stat-sub" id="sInN"></div>
    </div>
    <div class="stat">
      <div class="stat-lbl">Net</div>
      <div class="stat-val net" id="sNet">SGD —</div>
      <div class="stat-sub" id="sNetN"></div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <input  class="fi fi-search" type="text"    id="fSearch"   placeholder="Search…"         oninput="render()">
    <select class="fi"                           id="fMonth"                                   onchange="render()">
      <option value="">All months</option>
    </select>
    <select class="fi"                           id="fCat"                                     onchange="render()">
      <option value="">All categories</option>
      <option>Food</option><option>Transport</option><option>Lifestyle</option>
      <option>Necessity</option><option>Subscription</option><option>Travel</option>
      <option>Investments</option><option>Salary</option><option>Interest</option>
    </select>
    <select class="fi"                           id="fCard"                                    onchange="render()">
      <option value="">All cards</option>
      <option>DBS Debit</option><option>Citi Rewards</option>
      <option>HSBC</option><option>Trust</option><option>UOB Ladys</option>
    </select>
    <select class="fi"                           id="fType"                                    onchange="render()">
      <option value="">All types</option>
      <option>Expenses</option><option>Gain</option><option>Investments</option><option>Salary</option>
    </select>
    <select class="fi"                           id="fStatus"                                  onchange="render()">
      <option value="">All statuses</option>
      <option value="stmtd">Statemeneted</option>
      <option value="pending">Pending</option>
      <option value="clearing">Clearing</option>
      <option value="debit">Debit only</option>
    </select>
    <button class="fi-reset" onclick="resetFilters()">✕ Reset</button>
  </div>

  <!-- Meta -->
  <div class="meta">
    <span id="metaCount"></span>
    <span id="metaTotal"></span>
  </div>

  <!-- Table -->
  <div class="tbl-wrap" id="tblWrap">
    <div class="loading"><div class="spin"></div><span>Waiting for config…</span></div>
  </div>

</div><!-- /wrap -->

<!-- FAB -->
<button class="fab" onclick="openAdd()" title="New transaction">+</button>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ── Add / Edit modal ──────────────────────────────────────── -->
<div class="overlay off" id="mAdd">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="mAddTitle">New transaction</div>
      <button class="modal-close" onclick="close('mAdd')">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="fId">
      <div class="fr">
        <div class="fg"><label>Date</label><input type="date" id="fDate"></div>
        <div class="fg"><label>Amount (SGD)</label><input type="number" id="fAmt" placeholder="0.00" step="0.01" min="0"></div>
      </div>
      <div class="fg"><label>Description</label><input type="text" id="fDesc" placeholder="What was this?"></div>
      <div class="fr">
        <div class="fg"><label>Category</label>
          <select id="fCatF">
            <option>Food</option><option>Transport</option><option>Lifestyle</option>
            <option>Necessity</option><option>Subscription</option><option>Travel</option>
            <option>Investments</option><option>Salary</option><option>Interest</option>
          </select>
        </div>
        <div class="fg"><label>Type</label>
          <select id="fTypeF">
            <option>Expenses</option><option>Gain</option><option>Investments</option><option>Salary</option>
          </select>
        </div>
      </div>
      <div class="fg"><label>Card</label>
        <select id="fCardF" onchange="updateCC()">
          <option>DBS Debit</option><option>Citi Rewards</option>
          <option>HSBC</option><option>Trust</option><option>UOB Ladys</option>
        </select>
      </div>

      <!-- CC-only block -->
      <div class="cc-block" id="ccBlock" style="display:none">
        <div class="cc-block-lbl">Credit card status</div>
        <div class="tog-row">
          <span>Statemeneted</span>
          <label class="tog">
            <input type="checkbox" id="fStmtd">
            <span class="tog-sl"></span>
          </label>
        </div>
        <div class="tog-row">
          <span>Pending charge</span>
          <label class="tog">
            <input type="checkbox" id="fPending">
            <span class="tog-sl"></span>
          </label>
        </div>
      </div>

      <div class="form-acts">
        <button class="btn" onclick="close('mAdd')">Cancel</button>
        <button class="btn btn-primary" onclick="saveTx()">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Settings modal ────────────────────────────────────────── -->
<div class="overlay off" id="mSettings">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">GitHub sync</div>
      <button class="modal-close" onclick="close('mSettings')">×</button>
    </div>
    <div class="modal-body">
      <div class="note">
        ⚠ Your token is stored only in this browser's localStorage.
        Use a fine-grained PAT with <strong>Contents: read &amp; write</strong> on this repo only.
      </div>
      <div class="fg"><label>Owner (username or org)</label><input type="text" id="cOwner" placeholder="e.g. danielsg"></div>
      <div class="fg"><label>Repository</label><input type="text" id="cRepo" placeholder="e.g. expenses"></div>
      <div class="fg"><label>Branch</label><input type="text" id="cBranch" placeholder="main"></div>
      <div class="fg"><label>Personal Access Token</label><input type="password" id="cToken" placeholder="ghp_…"></div>
      <div class="form-acts">
        <button class="btn" onclick="close('mSettings')">Cancel</button>
        <button class="btn btn-primary" onclick="applyCfg()">Save &amp; sync</button>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  Constants
// ═══════════════════════════════════════════════════════════════
const CC = new Set(['Citi Rewards','HSBC','Trust','UOB Ladys']);
const CFG_K = 'ldgr_cfg';
const SHA_K  = 'ldgr_sha';

const CARD_COLOR = {
  'DBS Debit':    '#ef4444',
  'Citi Rewards': '#818cf8',
  'HSBC':         '#f43f5e',
  'Trust':        '#10b981',
  'UOB Ladys':    '#ec4899',
};

const CAT_CLASS = {
  Food:'p-food', Transport:'p-transport', Lifestyle:'p-lifestyle',
  Necessity:'p-necessity', Subscription:'p-subscription', Travel:'p-travel',
  Investments:'p-investments', Salary:'p-salary', Interest:'p-interest',
};

// ═══════════════════════════════════════════════════════════════
//  State
// ═══════════════════════════════════════════════════════════════
let txs = [];          // all transactions (sorted date desc)
let view = [];         // filtered + sorted
let sortK = 'date';
let sortD = -1;        // -1=desc, 1=asc

// ═══════════════════════════════════════════════════════════════
//  Config
// ═══════════════════════════════════════════════════════════════
const cfg = () => JSON.parse(localStorage.getItem(CFG_K) || '{}');
const saveCfg = c => localStorage.setItem(CFG_K, JSON.stringify(c));

// ═══════════════════════════════════════════════════════════════
//  Status
// ═══════════════════════════════════════════════════════════════
function status(state, txt) {
  document.getElementById('dot').className = 'dot ' + state;
  document.getElementById('syncLbl').textContent = txt;
}

// ═══════════════════════════════════════════════════════════════
//  Toast
// ═══════════════════════════════════════════════════════════════
let _tt;
function toast(msg, kind='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast show ${kind}`;
  clearTimeout(_tt);
  _tt = setTimeout(() => el.className = 'toast', 3200);
}

// ═══════════════════════════════════════════════════════════════
//  GitHub API
// ═══════════════════════════════════════════════════════════════
function ghHeaders(token) {
  return {
    'Authorization': `Bearer ${token}`,
    'Accept': 'application/vnd.github.v3+json',
    'Content-Type': 'application/json',
  };
}

async function ghGet() {
  const { owner, repo, branch='main', token } = cfg();
  if (!owner || !repo) throw new Error('Not configured — open ⚙ Settings');

  status('busy', 'Loading…');
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/data.json?ref=${branch}`;
  const res = await fetch(url, { headers: ghHeaders(token) });

  if (res.status === 404) {
    localStorage.removeItem(SHA_K);
    status('ok', 'New file');
    return { transactions: [] };
  }
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.message || `HTTP ${res.status}`);
  }

  const meta = await res.json();
  localStorage.setItem(SHA_K, meta.sha);
  const raw = JSON.parse(atob(meta.content.replace(/\s/g, '')));
  status('ok', 'Synced');
  return raw;
}

async function ghPut(data) {
  const { owner, repo, branch='main', token } = cfg();
  if (!owner || !repo || !token) throw new Error('Not configured');

  status('busy', 'Saving…');
  const sha   = localStorage.getItem(SHA_K);
  const body  = {
    message: `Update transactions ${new Date().toISOString().slice(0,10)}`,
    content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))),
    branch,
  };
  if (sha) body.sha = sha;

  const res = await fetch(
    `https://api.github.com/repos/${owner}/${repo}/contents/data.json`,
    { method:'PUT', headers: ghHeaders(token), body: JSON.stringify(body) }
  );

  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    if (res.status === 409) throw new Error('Conflict — click Sync to reload latest');
    throw new Error(e.message || `Save failed (${res.status})`);
  }

  const r = await res.json();
  localStorage.setItem(SHA_K, r.content.sha);
  status('ok', 'Saved');
}

// ═══════════════════════════════════════════════════════════════
//  Load / Save
// ═══════════════════════════════════════════════════════════════
async function load() {
  try {
    const data = await ghGet();
    txs = (data.transactions || []).slice().sort((a,b) => b.date.localeCompare(a.date));
    rebuildMonthFilter();
    render();
  } catch(e) {
    status('err', 'Error');
    document.getElementById('tblWrap').innerHTML = `
      <div class="empty">
        <div class="empty-ico">⚠️</div>
        <p>${esc(e.message)}</p>
      </div>`;
  }
}

async function save() {
  try {
    await ghPut({ transactions: txs });
    toast('Saved ✓');
  } catch(e) {
    status('err', 'Save failed');
    toast(e.message, 'bad');
    throw e;
  }
}

function manualSync() {
  load().then(() => toast('Synced ✓')).catch(e => toast(e.message, 'bad'));
}

// ═══════════════════════════════════════════════════════════════
//  Filters & Sort
// ═══════════════════════════════════════════════════════════════
function rebuildMonthFilter() {
  const months = [...new Set(txs.map(t => t.date.slice(0,7)))].sort().reverse();
  const sel = document.getElementById('fMonth');
  sel.innerHTML = '<option value="">All months</option>';
  months.forEach(m => {
    const [y,mo] = m.split('-');
    const lbl = new Date(+y,+mo-1,1).toLocaleString('en-SG',{month:'long',year:'numeric'});
    sel.innerHTML += `<option value="${m}">${lbl}</option>`;
  });
}

function render() {
  const search  = document.getElementById('fSearch').value.toLowerCase();
  const month   = document.getElementById('fMonth').value;
  const cat     = document.getElementById('fCat').value;
  const card    = document.getElementById('fCard').value;
  const type    = document.getElementById('fType').value;
  const status_ = document.getElementById('fStatus').value;

  view = txs.filter(t => {
    if (search && !t.description.toLowerCase().includes(search)
                && !t.category.toLowerCase().includes(search)
                && !t.card.toLowerCase().includes(search)) return false;
    if (month   && !t.date.startsWith(month))  return false;
    if (cat     && t.category !== cat)          return false;
    if (card    && t.card !== card)             return false;
    if (type    && t.type !== type)             return false;
    if (status_) {
      const isCC = CC.has(t.card);
      if (status_ === 'debit'   &&  isCC)               return false;
      if (status_ === 'debit'   && !isCC)               return true;
      if (!isCC)                                         return false;
      if (status_ === 'pending' && !t.pending)           return false;
      if (status_ === 'stmtd'  && !t.statementd)        return false;
      if (status_ === 'clearing' && (t.statementd||t.pending)) return false;
    }
    return true;
  });

  // Sort
  view.sort((a,b) => {
    let va = a[sortK], vb = b[sortK];
    if (sortK === 'amount') return sortD * (a.amount - b.amount);
    return sortD * String(va).localeCompare(String(vb));
  });

  renderStats();
  renderMeta();
  renderTable();
}

function toggleSort(k) {
  if (sortK === k) sortD *= -1; else { sortK = k; sortD = -1; }
  render();
}

function resetFilters() {
  ['fSearch','fMonth','fCat','fCard','fType','fStatus'].forEach(id => {
    const el = document.getElementById(id);
    el.value = '';
  });
  render();
}

// ═══════════════════════════════════════════════════════════════
//  Render helpers
// ═══════════════════════════════════════════════════════════════
const fmt  = n => 'SGD ' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const esc  = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function fmtDate(d) {
  const [y,m,dy] = d.split('-');
  return new Date(+y,+m-1,+dy).toLocaleDateString('en-SG',{day:'2-digit',month:'short',year:'numeric'});
}

function fmtMonth(m) {
  const [y,mo] = m.split('-');
  return new Date(+y,+mo-1,1).toLocaleString('en-SG',{month:'long',year:'numeric'});
}

function catClass(c) { return CAT_CLASS[c] || 'p-default'; }

function ccBadge(t, inline=false) {
  if (!CC.has(t.card)) return '';
  const id = esc(t.id);
  if (t.pending)    return `<span class="badge b-pending"  onclick="cycleBadge('${id}')" title="Click to cycle">⏳ Pending</span>`;
  if (t.statementd) return `<span class="badge b-stmtd"    onclick="cycleBadge('${id}')" title="Click to cycle">✓ Statemeneted</span>`;
  return               `<span class="badge b-clear"    onclick="cycleBadge('${id}')" title="Click to cycle">◌ Clearing</span>`;
}

function thIcon(k) {
  if (sortK !== k) return '';
  return sortD === -1 ? ' ↓' : ' ↑';
}
function thCls(k) { return sortK === k ? 'active' : ''; }

// ── Stats ──────────────────────────────────────────────────────
function renderStats() {
  let out=0,oc=0,inc=0,ic=0;
  view.forEach(t => {
    if (t.type==='Expenses'||t.type==='Investments') { out+=t.amount; oc++; }
    else                                              { inc+=t.amount; ic++; }
  });
  const net = inc - out;
  document.getElementById('sOut').textContent  = fmt(out);
  document.getElementById('sOutN').textContent = `${oc} transaction${oc!==1?'s':''}`;
  document.getElementById('sIn').textContent   = fmt(inc);
  document.getElementById('sInN').textContent  = `${ic} transaction${ic!==1?'s':''}`;
  const netEl = document.getElementById('sNet');
  netEl.textContent = (net>=0?'+':'')+fmt(Math.abs(net));
  netEl.className = 'stat-val net '+(net>0?'pos':net<0?'neg':'zero');
  document.getElementById('sNetN').textContent = `across ${view.length} transactions`;
}

function renderMeta() {
  document.getElementById('metaCount').textContent =
    view.length === txs.length ? `${txs.length} transactions`
                                : `${view.length} of ${txs.length} transactions`;
  const out = view.filter(t=>t.type==='Expenses'||t.type==='Investments')
                   .reduce((s,t)=>s+t.amount,0);
  document.getElementById('metaTotal').textContent =
    view.length ? `${fmt(out)} out` : '';
}

// ── Table ──────────────────────────────────────────────────────
function renderTable() {
  const el = document.getElementById('tblWrap');
  if (!view.length) {
    el.innerHTML = `<div class="empty"><div class="empty-ico">🔍</div><p>No transactions match.<br><strong>Reset filters</strong> or add a new one.</p></div>`;
    return;
  }

  let rows = '';
  let lastMonth = '';

  view.forEach(t => {
    const mo = t.date.slice(0,7);
    if (mo !== lastMonth && sortK === 'date') {
      rows += `<tr class="tr-month"><td colspan="8">${fmtMonth(mo)}</td></tr>`;
      lastMonth = mo;
    }
    const isOut = t.type==='Expenses'||t.type==='Investments';
    const amtCls = isOut ? 'out' : 'in';
    const sign    = isOut ? '−' : '+';
    const id = esc(t.id);

    rows += `
    <tr>
      <td class="td-date">${fmtDate(t.date)}</td>
      <td class="td-desc">${esc(t.description)}</td>
      <td><span class="pill ${catClass(t.category)}">${esc(t.category)}</span></td>
      <td class="col-card">
        <div class="card-tag">
          <div class="card-pip" style="background:${CARD_COLOR[t.card]||'#94a3b8'}"></div>
          ${esc(t.card)}
        </div>
      </td>
      <td class="col-status">${ccBadge(t)}</td>
      <td class="td-amt ${amtCls}">${sign} ${fmt(t.amount)}</td>
      <td>
        <div class="acts">
          <button class="act" onclick="openEdit('${id}')" title="Edit">✎</button>
          <button class="act del" onclick="deleteTx('${id}')" title="Delete">✕</button>
        </div>
      </td>
    </tr>`;
  });

  el.innerHTML = `
  <table>
    <thead>
      <tr>
        <th class="${thCls('date')}"     onclick="toggleSort('date')">Date${thIcon('date')}</th>
        <th class="${thCls('description')}" onclick="toggleSort('description')">Description${thIcon('description')}</th>
        <th class="${thCls('category')}" onclick="toggleSort('category')">Category${thIcon('category')}</th>
        <th class="col-card ${thCls('card')}" onclick="toggleSort('card')">Card${thIcon('card')}</th>
        <th class="col-status">Status</th>
        <th class="${thCls('amount')}"   onclick="toggleSort('amount')" style="text-align:right">Amount${thIcon('amount')}</th>
        <th style="width:52px"></th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// ═══════════════════════════════════════════════════════════════
//  Modals
// ═══════════════════════════════════════════════════════════════
function open(id)  { document.getElementById(id).classList.remove('off'); }
function close(id) { document.getElementById(id).classList.add('off');    }

document.querySelectorAll('.overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target===el) el.classList.add('off'); });
});

function updateCC() {
  const card = document.getElementById('fCardF').value;
  document.getElementById('ccBlock').style.display = CC.has(card) ? 'flex' : 'none';
}

function openAdd() {
  document.getElementById('mAddTitle').textContent = 'New transaction';
  document.getElementById('fId').value      = '';
  document.getElementById('fDate').value    = new Date().toISOString().slice(0,10);
  document.getElementById('fAmt').value     = '';
  document.getElementById('fDesc').value    = '';
  document.getElementById('fCatF').value    = 'Food';
  document.getElementById('fTypeF').value   = 'Expenses';
  document.getElementById('fCardF').value   = 'DBS Debit';
  document.getElementById('fStmtd').checked   = false;
  document.getElementById('fPending').checked = false;
  updateCC();
  open('mAdd');
  setTimeout(() => document.getElementById('fDesc').focus(), 80);
}

function openEdit(id) {
  const t = txs.find(x => x.id === id);
  if (!t) return;
  document.getElementById('mAddTitle').textContent    = 'Edit transaction';
  document.getElementById('fId').value               = t.id;
  document.getElementById('fDate').value             = t.date;
  document.getElementById('fAmt').value              = t.amount;
  document.getElementById('fDesc').value             = t.description;
  document.getElementById('fCatF').value             = t.category;
  document.getElementById('fTypeF').value            = t.type;
  document.getElementById('fCardF').value            = t.card;
  document.getElementById('fStmtd').checked          = !!t.statementd;
  document.getElementById('fPending').checked        = !!t.pending;
  updateCC();
  open('mAdd');
}

async function saveTx() {
  const id   = document.getElementById('fId').value;
  const desc = document.getElementById('fDesc').value.trim();
  const amt  = parseFloat(document.getElementById('fAmt').value);
  const date = document.getElementById('fDate').value;
  const card = document.getElementById('fCardF').value;

  if (!desc || isNaN(amt) || !date) { toast('Fill in all fields', 'bad'); return; }

  const t = {
    id: id || crypto.randomUUID(),
    description: desc,
    category: document.getElementById('fCatF').value,
    type:     document.getElementById('fTypeF').value,
    amount:   amt,
    date,
    card,
  };
  if (CC.has(card)) {
    t.statementd = document.getElementById('fStmtd').checked;
    t.pending    = document.getElementById('fPending').checked;
  }

  if (id) {
    const i = txs.findIndex(x => x.id === id);
    if (i >= 0) txs[i] = t;
  } else {
    txs.unshift(t);
  }
  txs.sort((a,b) => b.date.localeCompare(a.date));

  close('mAdd');
  rebuildMonthFilter();
  render();

  try { await save(); } catch(e) { /* toast already shown */ }
}

async function deleteTx(id) {
  if (!confirm('Delete this transaction?')) return;
  txs = txs.filter(t => t.id !== id);
  rebuildMonthFilter();
  render();
  try { await save(); } catch(e) {}
}

// Quick CC status cycle: Clearing → Statemeneted → Pending → Clearing
async function cycleBadge(id) {
  const t = txs.find(x => x.id === id);
  if (!t || !CC.has(t.card)) return;
  if (!t.statementd && !t.pending)   { t.statementd = true;  t.pending = false; }
  else if (t.statementd && !t.pending){ t.statementd = false; t.pending = true;  }
  else                                { t.statementd = false; t.pending = false; }
  render();
  try { await save(); } catch(e) {}
}

// ═══════════════════════════════════════════════════════════════
//  Settings
// ═══════════════════════════════════════════════════════════════
function openSettings() {
  const c = cfg();
  document.getElementById('cOwner').value  = c.owner  || '';
  document.getElementById('cRepo').value   = c.repo   || '';
  document.getElementById('cBranch').value = c.branch || 'main';
  document.getElementById('cToken').value  = c.token  || '';
  open('mSettings');
}

async function applyCfg() {
  const c = {
    owner:  document.getElementById('cOwner').value.trim(),
    repo:   document.getElementById('cRepo').value.trim(),
    branch: document.getElementById('cBranch').value.trim() || 'main',
    token:  document.getElementById('cToken').value.trim(),
  };
  if (!c.owner || !c.repo) { toast('Owner and repo required', 'bad'); return; }
  saveCfg(c);
  close('mSettings');
  await load();
}

// ═══════════════════════════════════════════════════════════════
//  Boot
// ═══════════════════════════════════════════════════════════════
(function init() {
  const c = cfg();
  if (c.owner && c.repo) {
    load();
  } else {
    status('', 'Not configured');
    document.getElementById('tblWrap').innerHTML = `
      <div class="empty">
        <div class="empty-ico">⚙️</div>
        <p>Click <strong>⚙</strong> in the top right to connect your GitHub repo.<br>
        Your <code>data.json</code> will be read and written there.</p>
      </div>`;
  }
})();
</script>
